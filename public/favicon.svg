<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Emerald Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Monogram Logo Content: Interlocking / Bold AS -->
  <g filter="url(#subtleShadow)">
    <!-- Primary 'A' -->
    <text
      x="226"
      y="350"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="285"
      font-weight="900"
      letter-spacing="-12"
      fill="#ffffff"
      text-anchor="middle"
    >A</text>

    <!-- Stylized Accent Dot / Creative Mark -->
    <circle cx="395" cy="328" r="32" fill="url(#glowGrad)" />
  </g>
</svg>
